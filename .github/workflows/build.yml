name: Build & Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ─── Windows ───────────────────────────────────────────────────────────────
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Write .env
        shell: pwsh
        run: |
          @"
          GOOGLE_DESKTOP_CLIENT_ID=${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          YANDEX_CLIENT_ID=${{ secrets.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET=${{ secrets.YANDEX_CLIENT_SECRET }}
          TELEGRAM_BOT_ID=${{ secrets.TELEGRAM_BOT_ID }}
          "@ | Out-File -FilePath .env -Encoding utf8NoBOM

      - run: npm ci

      - name: Download VPN engines (Xray-core + sing-box, bundled into installer)
        run: node scripts/download-engines.js

      - name: Build Windows
        run: node build-renderer.js && npx electron-builder --win --publish never
        env:
          NODE_ENV: production
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: win-artifacts
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/beta.yml
          if-no-files-found: error

  # ─── macOS ─────────────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Write .env
        run: |
          cat > .env << 'ENVEOF'
          GOOGLE_DESKTOP_CLIENT_ID=${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          YANDEX_CLIENT_ID=${{ secrets.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET=${{ secrets.YANDEX_CLIENT_SECRET }}
          TELEGRAM_BOT_ID=${{ secrets.TELEGRAM_BOT_ID }}
          ENVEOF

      - run: npm ci

      - name: Resize icon to 512x512 (macOS requirement)
        run: sips -z 512 512 assets/icon.png --out assets/icon.png

      - name: Download VPN engines (Xray-core + sing-box, bundled into installer)
        run: node scripts/download-engines.js

      - name: Build macOS (unsigned)
        run: node build-renderer.js && npx electron-builder --mac --publish never
        env:
          NODE_ENV: production
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'

      - uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/latest-mac.yml
            dist/beta-mac.yml
          if-no-files-found: error

  # ─── Linux ─────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Linux build deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libnotify-dev libnss3 libxss1 \
            libasound2-dev libxtst-dev xvfb \
            dpkg-dev fakeroot rpm imagemagick

      - name: Write .env
        run: |
          cat > .env << 'ENVEOF'
          GOOGLE_DESKTOP_CLIENT_ID=${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          YANDEX_CLIENT_ID=${{ secrets.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET=${{ secrets.YANDEX_CLIENT_SECRET }}
          TELEGRAM_BOT_ID=${{ secrets.TELEGRAM_BOT_ID }}
          ENVEOF

      - run: npm ci

      - name: Resize icon to 512x512 (Linux requirement)
        run: convert assets/icon.png -resize 512x512 assets/icon.png

      - name: Download VPN engines (Xray-core + sing-box, bundled into installer)
        run: node scripts/download-engines.js

      - name: Build Linux
        run: node build-renderer.js && npx electron-builder --linux AppImage deb --x64 --publish never
        env:
          NODE_ENV: production
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
            dist/beta-linux.yml
          if-no-files-found: error

  # ─── Deploy ────────────────────────────────────────────────────────────────
  deploy:
    needs: [build-win, build-mac, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show artifact tree
        run: find artifacts -type f | sort

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # Beta testers (since 3.8.1). A tag like v3.8.2-beta.1 builds beta*.yml only: it reaches just the testers (the
      # owner's list on the server, their Centrio reads beta*.yml). An ordinary tag publishes latest*.yml for everyone and
      # copies it to beta*.yml, so testers get ordinary releases too — unless the testers already have a newer test version.
      - name: Upload installers and update files
        env:
          TAG: ${{ github.ref_name }}
          DEST: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no"
          SCP="scp -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no"
          ROOT=/var/www/centrio-downloads
          case "$TAG" in *-beta*) BETA=1 ;; *) BETA=0 ;; esac
          echo "tag $TAG beta=$BETA"

          $SCP artifacts/win-artifacts/*.exe artifacts/win-artifacts/*.exe.blockmap "$DEST:$ROOT/"
          $SCP artifacts/mac-artifacts/*.dmg "$DEST:$ROOT/mac/"
          $SCP artifacts/linux-artifacts/*.AppImage artifacts/linux-artifacts/*.deb "$DEST:$ROOT/linux/"

          # newer A B: succeeds when version A is newer than B (a release is newer than its own betas)
          newer() { node scripts/version-newer.js "$1" "$2"; }

          publish() { # <artifact dir> <server dir> <suffix: "" | -mac | -linux>
            local dir="$1" to="$2" sfx="$3" mine theirs
            if [ "$BETA" = 1 ]; then
              $SCP "$dir/beta$sfx.yml" "$DEST:$to/beta$sfx.yml"
              echo "beta$sfx.yml -> $TAG"
              return
            fi
            $SCP "$dir/latest$sfx.yml" "$DEST:$to/latest$sfx.yml"
            mine=$(grep -m1 '^version:' "$dir/latest$sfx.yml" | awk '{print $2}')
            theirs=$($SSH "$DEST" "grep -m1 '^version:' $to/beta$sfx.yml 2>/dev/null" | awk '{print $2}' || true)
            if [ -z "$theirs" ] || newer "$mine" "$theirs"; then
              $SCP "$dir/latest$sfx.yml" "$DEST:$to/beta$sfx.yml"
              echo "beta$sfx.yml -> $mine"
            else
              echo "beta$sfx.yml stays $theirs (newer than $mine)"
            fi
          }
          publish artifacts/win-artifacts "$ROOT" ""
          publish artifacts/mac-artifacts "$ROOT/mac" "-mac"
          publish artifacts/linux-artifacts "$ROOT/linux" "-linux"

      - run: echo "✅ All builds deployed"
