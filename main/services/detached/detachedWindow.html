<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centrio</title>
<link rel="stylesheet" href="../../../assets/fonts/site/fonts.css">
<style>
    /* 3.7.4: the main window's typeface (assets/fonts/site/fonts.css is linked above) */

    /* 3.7.4: the window takes the whole look of the main one (shared/theme-fx.js windowLook): the palette of the
       chosen theme, Аврора with its northern light, Время суток with the sky of the hour. */
    :root {
        --bg: #0f0f10;
        --card: #141417;
        --bar-2: rgba(255, 255, 255, 0.05);
        --line: rgba(255, 255, 255, 0.07);
        --text: #ececee;
        --muted: #9b9ba3;
        --hover: rgba(255, 255, 255, 0.08);
        --press: rgba(255, 255, 255, 0.13);
        --accent: #7b68ee;
        --accent-soft: rgba(123, 104, 238, 0.18);
        --on-accent: #ffffff;
        --pop: #1d1d20;
        --shadow: 0 18px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.07);
        color-scheme: dark;
    }
    :root[data-palette="dock"] { --bg: #09090f; --card: #0e0e17; --pop: #13131e; }
    :root[data-palette="adaptive"] { --bg: #0f1117; --card: #161b27; --pop: #1c2236; }
    :root[data-palette="midnight"] { --bg: #050508; --card: #0d0d12; --pop: #12121a; }
    :root[data-palette="dark"] { --bg: #0f0f0f; --card: #161616; --pop: #1e1e1e; }
    :root[data-mode="light"] {
        --bg: #eef0f4;
        --card: #ffffff;
        --bar-2: rgba(0, 0, 0, 0.04);
        --line: rgba(0, 0, 0, 0.09);
        --text: #18181b;
        --muted: #6b6b75;
        --hover: rgba(0, 0, 0, 0.06);
        --press: rgba(0, 0, 0, 0.11);
        --accent-soft: rgba(123, 104, 238, 0.14);
        --pop: #ffffff;
        --shadow: 0 18px 40px rgba(0, 0, 0, 0.16), 0 0 0 1px rgba(0, 0, 0, 0.08);
        color-scheme: light;
    }
    :root[data-fx="aurora"] { --bg: #04060c; --card: rgba(8, 11, 20, 0.78); --pop: #111624; --line: rgba(255, 255, 255, 0.08); --text: #e4eef8; --muted: #7f93ab; }
    :root[data-tod="morning"] { --bg: #ffcfb0; --text: #3a2230; --muted: #8a5a62; --hover: rgba(120, 60, 70, .08); --press: rgba(120, 60, 70, .14); --line: rgba(120, 60, 70, .14); }
    :root[data-tod="day"] { --bg: #cfe0ff; --text: #18233a; --muted: #5a6a8a; --hover: rgba(30, 60, 120, .07); --press: rgba(30, 60, 120, .12); --line: rgba(30, 60, 120, .12); }
    :root[data-tod="evening"] { --bg: #3a1c3e; --card: rgba(32, 16, 30, .86); --pop: #2a1630; --text: #fff3ea; --muted: #e6b9a4; --hover: rgba(255, 220, 190, .08); --press: rgba(255, 220, 190, .14); --line: rgba(255, 220, 190, .12); }
    :root[data-tod="night"] { --bg: #070d22; --card: rgba(8, 13, 32, .88); --pop: #0d1530; --text: #dfe6ff; --muted: #8794c0; --hover: rgba(160, 180, 255, .07); --press: rgba(160, 180, 255, .12); --line: rgba(160, 180, 255, .1); }

    /* the effect layer behind the whole window, the same paint as styles-themes-fx.css */
    .fx { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; display: none; }
    :root[data-fx] .fx { display: block; }
    .fx span { position: absolute; }
    :root[data-fx="aurora"] .fx { background: #04060c; }
    .fx .g { display: none; border-radius: 50%; opacity: .7; mix-blend-mode: screen; will-change: transform; animation: drift1 26s ease-in-out infinite alternate; }
    :root[data-fx="aurora"] .fx .g { display: block; }
    .fx .g1 { left: -10%; top: -20%; width: 70%; height: 75%; background: radial-gradient(closest-side, #19d3a2, rgba(25, 211, 162, 0)); }
    .fx .g2 { left: 40%; top: -30%; width: 75%; height: 70%; background: radial-gradient(closest-side, #7c5cff, rgba(124, 92, 255, 0)); animation-name: drift2; animation-duration: 32s; }
    .fx .g3 { left: 15%; top: 45%; width: 85%; height: 80%; background: radial-gradient(closest-side, #0ea5e9, rgba(14, 165, 233, 0)); animation-name: drift3; animation-duration: 38s; opacity: .55; }
    @keyframes drift1 { to { transform: translate(22%, 14%) scale(1.15); } }
    @keyframes drift2 { to { transform: translate(-26%, 18%) scale(.9); } }
    @keyframes drift3 { to { transform: translate(12%, -20%) scale(1.2); } }
    :root[data-tod="morning"] .fx { background: linear-gradient(180deg, #ffcfb0 0%, #ffc4b4 50%, #f7b3c6 100%); }
    :root[data-tod="day"] .fx { background: linear-gradient(180deg, #cfe0ff 0%, #d9e6ff 50%, #c7dbff 100%); }
    :root[data-tod="evening"] .fx { background: linear-gradient(180deg, #2a1638 0%, #4d2444 45%, #8f3f3a 100%); }
    :root[data-tod="night"] .fx { background: linear-gradient(180deg, #050a1c 0%, #0a1330 55%, #131f44 100%); }
    .fx .stars { inset: 0; opacity: 0; background-image:
        radial-gradient(1.5px 1.5px at 12% 18%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 34% 8%, #fff 50%, transparent 51%),
        radial-gradient(1.2px 1.2px at 58% 22%, #dfe8ff 50%, transparent 51%), radial-gradient(1px 1px at 77% 12%, #fff 50%, transparent 51%),
        radial-gradient(1.4px 1.4px at 91% 30%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 6% 62%, #cfe0ff 50%, transparent 51%); }
    :root[data-tod="night"] .fx .stars { opacity: .75; }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
        font-family: 'Geist', 'Segoe UI', -apple-system, sans-serif; font-size: 13px; -webkit-font-smoothing: antialiased; user-select: none; }
    button { font: inherit; color: inherit; }
    .drag { -webkit-app-region: drag; }
    .no-drag { -webkit-app-region: no-drag; }

    .shell { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; }
    :root[data-fx] body { background: transparent; }

    /* ── title bar ─────────────────────────────────────────────── */
    .bar { position: relative; display: flex; align-items: center; height: 40px; flex: 0 0 auto; padding-left: 12px;
        background: transparent; }
    .identity { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1 1 auto; padding-right: 10px; }
    .ico { width: 22px; height: 22px; flex: 0 0 auto; border-radius: 7px; object-fit: cover; background: var(--bar-2); box-shadow: 0 0 0 1px var(--line); }
    .name { min-width: 0; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { flex: 0 0 auto; min-width: 18px; height: 18px; padding: 0 6px; border-radius: 9px; background: var(--accent); color: var(--on-accent);
        font-size: 11px; font-weight: 600; line-height: 18px; text-align: center; font-variant-numeric: tabular-nums; }
    .badge[hidden] { display: none; }

    .tools { display: flex; align-items: center; gap: 2px; padding-right: 6px; }
    .tool { position: relative; display: grid; place-items: center; width: 32px; height: 28px; border: 0; border-radius: 8px; background: transparent;
        color: var(--muted); cursor: pointer; transition: background .14s ease, color .14s ease; }
    .tool:hover { background: var(--hover); color: var(--text); }
    .tool:active { background: var(--press); }
    .tool.on { background: var(--accent-soft); color: var(--accent); }
    .tool:focus-visible, .win:focus-visible, .nav:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .tool svg { width: 16px; height: 16px; }
    .sep { width: 1px; height: 16px; margin: 0 6px; background: var(--line); }

    .win { display: grid; place-items: center; width: 46px; height: 40px; border: 0; background: transparent; color: var(--muted); cursor: pointer;
        transition: background .12s ease, color .12s ease; }
    .win:hover { background: var(--hover); color: var(--text); }
    .win.close:hover { background: #e81123; color: #fff; }
    .win svg { width: 10px; height: 10px; }

    .progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; overflow: hidden; opacity: 0; transition: opacity .2s ease; pointer-events: none; }
    .progress.on { opacity: 1; }
    .progress::before { content: ''; position: absolute; top: 0; bottom: 0; width: 38%; border-radius: 2px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: slide 1.15s ease-in-out infinite; }
    @keyframes slide { from { left: -40%; } to { left: 102%; } }

    /* ── popover: opacity ───────────────────────────────────────── */
    .pop { position: absolute; top: 44px; right: 96px; z-index: 20; width: 212px; padding: 14px 14px 12px; border-radius: 14px; background: var(--pop); box-shadow: var(--shadow);
        transform-origin: 82% 0; animation: pop .14s ease-out; }
    .pop[hidden] { display: none; }
    @keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
    .pop-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; color: var(--muted); font-size: 12px; }
    .pop-head b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; margin: 0; background: transparent; cursor: pointer; }
    input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px;
        background: linear-gradient(90deg, var(--accent) var(--fill, 100%), var(--press) var(--fill, 100%)); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: #fff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, .45), 0 0 0 1px rgba(0, 0, 0, .1); transition: transform .12s ease; }
    input[type=range]:active::-webkit-slider-thumb { transform: scale(1.12); }

    /* ── find bar ───────────────────────────────────────────────── */
    .find { display: flex; align-items: center; gap: 6px; height: 46px; flex: 0 0 auto; margin: 0 8px 6px; padding: 0 10px; border-radius: 12px; background: var(--card); box-shadow: 0 0 0 1px var(--line); animation: drop .16s ease-out; }
    .find[hidden] { display: none; }
    @keyframes drop { from { opacity: 0; transform: translateY(-6px); } }
    .find input { flex: 1 1 auto; min-width: 0; height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--bar-2); color: var(--text);
        font: inherit; outline: none; user-select: text; transition: border-color .14s ease, box-shadow .14s ease; }
    .find input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .find input::placeholder { color: var(--muted); }
    .find .count { min-width: 44px; color: var(--muted); font-size: 12px; text-align: center; font-variant-numeric: tabular-nums; }
    .find .count.none { color: #f0716c; }
    .nav { display: grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; }
    .nav:hover { background: var(--hover); color: var(--text); }
    .nav svg { width: 15px; height: 15px; }

    /* ── page area ──────────────────────────────────────────────── */
    .stage { position: relative; flex: 1 1 auto; min-height: 0; margin: 0 8px 8px; border-radius: 12px; overflow: hidden; background: var(--card);
        box-shadow: 0 0 0 1px var(--line), 0 10px 30px rgba(0, 0, 0, .18); }
    webview { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
    .fail { position: absolute; inset: 0; z-index: 5; display: grid; place-content: center; justify-items: center; gap: 14px; padding: 28px; text-align: center; background: var(--card); }
    .fail[hidden] { display: none; }
    .fail p { margin: 0; max-width: 280px; color: var(--muted); line-height: 1.55; }
    .fail .retry { height: 34px; padding: 0 18px; border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-weight: 600; cursor: pointer;
        transition: filter .14s ease, transform .14s ease; }
    .fail .retry:hover { filter: brightness(1.1); }
    .fail .retry:active { transform: scale(.97); }
    .fail svg { width: 36px; height: 36px; color: var(--muted); }

    @media (max-width: 420px) { .sep, #opacityBtn { display: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="fx" aria-hidden="true"><span class="g g1"></span><span class="g g2"></span><span class="g g3"></span><span class="stars"></span></div>
<div class="shell">
    <header class="bar drag">
        <div class="identity">
            <img class="ico" id="ico" alt="" draggable="false">
            <span class="name" id="name"></span>
            <span class="badge" id="badge" hidden></span>
        </div>
        <div class="tools no-drag">
            <button class="tool" id="reloadBtn" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.34 5.66"/><path d="M20 4v7h-7"/></svg>
            </button>
            <button class="tool" id="findBtn" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
            </button>
            <button class="tool" id="opacityBtn" type="button" aria-haspopup="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17" /><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></svg>
            </button>
            <button class="tool" id="pinBtn" type="button" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 3h6l-.8 5.2L18 12v2H6v-2l3.8-3.8z"/></svg>
            </button>
            <button class="tool" id="dockBtn" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3.5"/><path d="M9.5 14.5 15 9"/><path d="M10 9h5v5"/></svg>
            </button>
            <span class="sep"></span>
        </div>
        <div class="no-drag" style="display:flex">
            <button class="win" id="minBtn" type="button"><svg viewBox="0 0 10 10"><path d="M0 5.5h10" stroke="currentColor" stroke-width="1"/></svg></button>
            <button class="win" id="maxBtn" type="button"><svg id="maxIcon" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><rect x=".5" y=".5" width="9" height="9" rx="1.2"/></svg></button>
            <button class="win close" id="closeBtn" type="button"><svg viewBox="0 0 10 10" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><path d="M.8.8l8.4 8.4M9.2.8.8 9.2"/></svg></button>
        </div>
        <div class="progress" id="progress"></div>
        <div class="pop no-drag" id="pop" hidden>
            <div class="pop-head"><span id="popLabel"></span><b id="popValue">100%</b></div>
            <input type="range" id="opacityRange" min="35" max="100" step="1" value="100">
        </div>
    </header>

    <div class="find no-drag" id="find" hidden>
        <input type="text" id="findInput" spellcheck="false" autocomplete="off">
        <span class="count" id="findCount"></span>
        <button class="nav" id="findPrev" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg></button>
        <button class="nav" id="findNext" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
        <button class="nav" id="findClose" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>

    <main class="stage" id="stage">
        <div class="fail" id="fail" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.5h.01"/></svg>
            <p id="failText"></p>
            <button class="retry" id="retryBtn" type="button"></button>
        </div>
    </main>
</div>

<script>
(() => {
    const api = window.centrioDetached
    const $ = (id) => document.getElementById(id)
    const el = {
        ico: $('ico'), name: $('name'), badge: $('badge'), progress: $('progress'), stage: $('stage'), fail: $('fail'), failText: $('failText'), retryBtn: $('retryBtn'),
        reload: $('reloadBtn'), find: $('findBtn'), opacityBtn: $('opacityBtn'), pin: $('pinBtn'), dock: $('dockBtn'),
        min: $('minBtn'), max: $('maxBtn'), close: $('closeBtn'), maxIcon: $('maxIcon'),
        pop: $('pop'), popLabel: $('popLabel'), popValue: $('popValue'), range: $('opacityRange'),
        findBar: $('find'), findInput: $('findInput'), findCount: $('findCount'), findPrev: $('findPrev'), findNext: $('findNext'), findClose: $('findClose')
    }
    let data = null
    let view = null
    let state = { maximized: false, pinned: false, opacity: 1, unread: 0 }
    let zoom = 1

    const label = (button, text) => { button.title = text; button.setAttribute('aria-label', text) }

    function applyState(next) {
        state = { ...state, ...next }
        el.badge.hidden = !(state.unread > 0)
        el.badge.textContent = state.unread > 99 ? '99+' : String(state.unread)
        el.pin.classList.toggle('on', !!state.pinned)
        el.pin.setAttribute('aria-pressed', state.pinned ? 'true' : 'false')
        label(el.pin, state.pinned ? data.strings.unpin : data.strings.pin)
        el.opacityBtn.classList.toggle('on', state.opacity < 0.995)
        const pct = Math.round(state.opacity * 100)
        el.range.value = String(pct)
        el.range.style.setProperty('--fill', ((pct - 35) / 65) * 100 + '%')
        el.popValue.textContent = pct + '%'
        label(el.max, state.maximized ? data.strings.restore : data.strings.maximize)
        el.maxIcon.innerHTML = state.maximized
            ? '<path d="M2.5 2.5V.5h7v7h-2" /><rect x=".5" y="2.5" width="7" height="7" rx="1.2"/>'
            : '<rect x=".5" y=".5" width="9" height="9" rx="1.2"/>'
    }

    // ── find in page ────────────────────────────────────────────
    function openFind() {
        el.findBar.hidden = false
        el.findInput.focus()
        el.findInput.select()
    }
    function closeFind() {
        el.findBar.hidden = true
        el.findCount.textContent = ''
        try { view.stopFindInPage('clearSelection') } catch {}
        view.focus()
    }
    function runFind(forward, next) {
        const text = el.findInput.value
        if (!text) { try { view.stopFindInPage('clearSelection') } catch {}; el.findCount.textContent = ''; return }
        // A new text starts a fresh search; the arrows (and Enter) step through the matches of the current one.
        try { if (next) view.findInPage(text, { forward, findNext: true }); else view.findInPage(text) } catch {}
    }

    // ── zoom (keys forwarded by the main process) ───────────────
    function setZoom(value) {
        zoom = Math.max(0.25, Math.min(5, value))
        try { view.setZoomFactor(zoom) } catch {}
    }

    function showFail(show) {
        el.fail.hidden = !show
    }

    function buildView() {
        const m = data.messenger
        zoom = typeof m.zoomLevel === 'number' ? m.zoomLevel : 1
        view = document.createElement('webview')
        // Same attributes the tabs in the main window use, set BEFORE the page is attached.
        view.setAttribute('partition', data.partition)
        view.setAttribute('preload', data.preloadUrl)
        view.setAttribute('useragent', data.userAgent)
        view.setAttribute('allowpopups', 'true')
        view.src = data.startUrl || m.url

        view.addEventListener('dom-ready', () => {
            try { view.setZoomFactor(zoom) } catch {}
            if (m.forceDarkMode) {
                view.insertCSS('html { filter: invert(1) hue-rotate(180deg) !important; } img, video, canvas, [style*="background-image"] { filter: invert(1) hue-rotate(180deg) !important; }').catch(() => {})
            }
        })
        view.addEventListener('did-start-loading', () => el.progress.classList.add('on'))
        view.addEventListener('did-stop-loading', () => el.progress.classList.remove('on'))
        view.addEventListener('did-finish-load', () => { showFail(false); try { view.setZoomFactor(zoom) } catch {} })
        view.addEventListener('did-fail-load', (e) => {
            // -3 is "aborted" (a new navigation replaced this one); sub-frames never matter here.
            if (e.isMainFrame && e.errorCode !== -3 && e.errorCode !== 0) showFail(true)
        })
        view.addEventListener('found-in-page', (e) => {
            const r = e.result || {}
            const none = !r.matches
            el.findCount.textContent = none ? data.strings.findNone : `${r.activeMatchOrdinal}/${r.matches}`
            el.findCount.classList.toggle('none', none)
        })
        el.stage.insertBefore(view, el.fail)
    }

    function wire() {
        el.reload.addEventListener('click', () => { showFail(false); view.reload() })
        el.retryBtn.addEventListener('click', () => { showFail(false); view.src = data.startUrl || data.messenger.url })
        el.find.addEventListener('click', () => (el.findBar.hidden ? openFind() : closeFind()))
        el.pin.addEventListener('click', () => api.control('pin', !state.pinned))
        el.dock.addEventListener('click', () => api.control('close'))
        el.min.addEventListener('click', () => api.control('minimize'))
        el.max.addEventListener('click', () => api.control('maximize'))
        el.close.addEventListener('click', () => api.control('close'))

        el.opacityBtn.addEventListener('click', (e) => { e.stopPropagation(); el.pop.hidden = !el.pop.hidden })
        el.pop.addEventListener('click', (e) => e.stopPropagation())
        document.addEventListener('click', () => { el.pop.hidden = true })
        el.range.addEventListener('input', () => {
            const pct = Number(el.range.value)
            el.range.style.setProperty('--fill', ((pct - 35) / 65) * 100 + '%')
            el.popValue.textContent = pct + '%'
            api.control('opacity', pct / 100)
        })

        el.findInput.addEventListener('input', () => runFind(true, false))
        el.findInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); runFind(!e.shiftKey, true) }
            else if (e.key === 'Escape') { e.preventDefault(); closeFind() }
        })
        el.findPrev.addEventListener('click', () => runFind(false, true))
        el.findNext.addEventListener('click', () => runFind(true, true))
        el.findClose.addEventListener('click', closeFind)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { if (!el.pop.hidden) el.pop.hidden = true }
            else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); openFind() }
        })

        // typing continues in the messenger as soon as the window gets the focus back
        window.addEventListener('focus', () => { if (el.findBar.hidden && view) view.focus() })

        api.onState(applyState)
        api.onCommand((command) => {
            if (command === 'find') openFind()
            else if (command === 'reload') { showFail(false); view.reload() }
            else if (command === 'zoom-in') setZoom(zoom + 0.25)
            else if (command === 'zoom-out') setZoom(zoom - 0.25)
            else if (command === 'zoom-reset') setZoom(1)
        })
    }

    // 3.7.4: the whole look of the main window, applied again when it changes there or the time of day moves on
    function applyLook(look) {
        if (!look) return
        const root = document.documentElement
        root.dataset.mode = look.mode === 'light' ? 'light' : 'dark'
        root.dataset.palette = look.palette || 'embedded'
        if (look.fx) root.dataset.fx = look.fx; else delete root.dataset.fx
        if (look.phase) root.dataset.tod = look.phase; else delete root.dataset.tod
        if (look.accent) {
            root.style.setProperty('--accent', look.accent)
            root.style.setProperty('--accent-soft', look.accent + '2e')
        }
    }

    async function boot() {
        data = await api.init()
        if (!data) return
        applyLook(data.look)
        api.onTheme(applyLook)
        document.title = data.messenger.name
        el.name.textContent = data.messenger.name
        if (data.messenger.icon) {
            el.ico.src = /^(https?:|data:)/.test(data.messenger.icon) ? data.messenger.icon : '../../../' + data.messenger.icon.replace(/^\/+/, '')
            el.ico.onerror = () => { el.ico.style.visibility = 'hidden' }
        } else el.ico.style.visibility = 'hidden'

        const s = data.strings
        label(el.reload, s.reload); label(el.find, s.find); label(el.opacityBtn, s.opacity); label(el.dock, s.dock)
        label(el.min, s.minimize); label(el.close, s.close)
        label(el.findPrev, s.prev); label(el.findNext, s.next); label(el.findClose, s.close)
        el.popLabel.textContent = s.opacity
        el.findInput.placeholder = s.findPlaceholder
        el.failText.textContent = s.loadFailed
        el.retryBtn.textContent = s.retry

        // A window opened for a link has no tab to go back to.
        if (data.isLink) { el.dock.hidden = true; el.dock.nextElementSibling && (el.dock.nextElementSibling.hidden = true) }
        applyState(data.state)
        buildView()
        wire()
    }
    boot()
})()
</script>
</body>
</html>
